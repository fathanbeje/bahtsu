server {
    listen 80;
    server_name bahtsu.mia02sgs.sch.id;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/bahtsu.mia02sgs.sch.id;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bahtsu.mia02sgs.sch.id;

    ssl_certificate     /www/server/panel/vhost/cert/bahtsu.mia02sgs.sch.id/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/bahtsu.mia02sgs.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    error_page 497 https://$host$request_uri;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/bahtsu.mia02sgs.sch.id;
        try_files $uri =404;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:20130;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # SSE & Streaming Support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /www/wwwlogs/bahtsu.mia02sgs.sch.id.log;
    error_log /www/wwwlogs/bahtsu.mia02sgs.sch.id.error.log;
}
